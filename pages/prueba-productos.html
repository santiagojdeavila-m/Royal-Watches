<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de productos | Royal Watches</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <main class="auth">
        <div class="auth-card auth-card-ancha">
            <h1>Productos de prueba</h1>
            <p class="auth-subtitulo">Herramienta de desarrollo: habla con el backend en localhost:4000.</p>
            <p class="auth-subtitulo" id="prueba-sesion"></p>

            <form id="form-producto-prueba" novalidate>
                <div class="form-fila">
                    <div class="form-grupo">
                        <label for="prueba-nombre">Nombre</label>
                        <input type="text" id="prueba-nombre" name="nombre" placeholder="Nombre del reloj">
                    </div>
                    <div class="form-grupo">
                        <label for="prueba-marca">Marca</label>
                        <input type="text" id="prueba-marca" name="marca" placeholder="Marca">
                    </div>
                </div>
                <div class="form-fila">
                    <div class="form-grupo">
                        <label for="prueba-precio">Precio</label>
                        <input type="number" id="prueba-precio" name="precio" step="any" placeholder="0">
                    </div>
                    <div class="form-grupo">
                        <label for="prueba-imagen">Imagen</label>
                        <input type="text" id="prueba-imagen" name="imagen" placeholder="img/img-catalogo/archivo.png">
                    </div>
                </div>
                <div class="form-grupo">
                    <label for="prueba-descripcion">Descripción</label>
                    <input type="text" id="prueba-descripcion" name="descripcion" placeholder="Descripción corta">
                </div>
                <label class="form-check">
                    <input type="checkbox" id="prueba-destacado" name="destacado"> Producto destacado
                </label>
                <button type="submit" class="btn-primary btn-auth">Crear producto</button>
            </form>

            <p class="mensaje-error" id="prueba-mensaje"></p>

            <ul class="lista-productos" id="lista-productos"></ul>
        </div>
    </main>
    <script src="../js/prueba-productos.js"></script>
</body>
</html>
